[project]
name = "volley-predictor"
version = "0.1.0"
description = "Predictor probabilístico de partidos de vóley entre selecciones nacionales."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "fivbvis>=0.3",
    "httpx>=0.26",
    "pycountry>=24.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "shap>=0.45",
    "mlflow>=2.10",
]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
